name: Public invite permission tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  invite-permissions:
    name: Check public invite permission defaults
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Test website invite permission defaults
        run: node --test tests/publicInvitePermissions.test.js
