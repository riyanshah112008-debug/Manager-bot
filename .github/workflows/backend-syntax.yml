name: Backend and dashboard checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate bot and website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked production dependencies
        run: npm ci --omit=dev --legacy-peer-deps
      - name: Check backend and website JavaScript syntax
        run: |
          find src public -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check deploy-commands.js
      - name: Validate Render audio supervisor shell syntax
        run: sh -n scripts/start-services.sh
      - name: Build Render production container
        run: docker build --pull --tag starry-render-audio-validation .
      - name: Run deterministic verification tests
        run: npm test
