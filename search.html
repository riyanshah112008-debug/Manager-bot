<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results for "Gaming" - Starryboard</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="search.css">
</head>
<body>

<!-- Header Section -->
<header>
    <nav class="sb-nav">
        <div class="sb-nav-top">
            <a href="index.html" class="sb-logo">
                <i class="fa-solid fa-compass sb-logo-icon"></i>
                <span>STARRYBOARD</span>
            </a>
            <button class="sb-btn-login">
                <i class="fa-brands fa-discord"></i>
                <span>Login with Discord</span>
            </button>
        </div>
    </nav>
</header>

<!-- Main Search Layout -->
<main class="sb-search-container">

    <!-- Breadcrumb & Page Info -->
    <div class="sb-breadcrumb">
        <a href="index.html">Home</a>
        <i class="fa-solid fa-chevron-right"></i>
        <span>Search</span>
    </div>

    <!-- Top Hero Search Bar -->
    <section class="sb-search-hero">
        <!-- 1. 标题默认为空 "" -->
        <h1 class="sb-search-heading">Results for <span class="sb-highlight" id="searchHighlight">""</span></h1>

        <div class="sb-search-box">
            <label for="searchInput"></label><input type="text" value="" placeholder="Search servers, tags, topics..." class="sb-search-input" id="searchInput" autocomplete="off">
            <button type="button" class="sb-search-clear" id="clearSearchBtn"><i class="fa-solid fa-xmark"></i></button>
            <button type="button" class="sb-search-btn" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Dynamic Related Tag Cloud -->
        <div class="sb-related-tags">
            <span class="sb-related-title"><i class="fa-solid fa-tags"></i> Recommend:</span>
            <!-- 2. 此处由 JavaScript 自动随机生成并绑定点击事件 -->
            <div id="recommendTagsContainer" style="display: inline-flex; gap: 8px; flex-wrap: wrap;"></div>
        </div>
    </section><!-- 修复点：添加缺少的 </section> 闭合标签 -->

    <!-- Filters Bar (功能增强型筛选器) -->
    <div class="sb-filter-bar">
        <div class="sb-filter-group">

            <!-- Sort Selector (包含：最新顶置、最近加入、成员最多) -->
            <div class="sb-dropdown">
                <i class="fa-solid fa-arrow-down-wide-short sb-dropdown-icon"></i>
                <label for="sortSelect"></label><select class="sb-dropdown-select" id="sortSelect">
                    <option value="bumped" selected>Bumped Recently</option>
                    <option value="newest">Recently Added</option>
                    <option value="members">Most Members</option>
                </select>
                <i class="fa-solid fa-chevron-down sb-dropdown-arrow"></i>
            </div>

        </div>

        <!-- Safe Filter Switch (NSFW 切换) -->
        <div class="sb-toggle-group">
            <label class="sb-switch">
                <input type="checkbox" id="nsfwToggle">
                <span class="sb-slider"></span>
            </label>
            <span class="sb-toggle-label"><i class="fa-solid fa-shield-halved"></i> Allow NSFW</span>
        </div>
    </div>

    <!-- Results Meta Header (动态更新总数) -->
    <div class="sb-results-meta">
        <span>Found <strong id="totalServerCount">0</strong> servers active right now</span>
    </div>
    <!-- Server Grid (数据列表容器) -->
    <div class="sb-grid" id="serverGrid">
        <!-- 卡片数据由 JS 动态生成 -->
    </div>
    <!-- Pagination (翻页器容器，由 JS 动态渲染) -->
    <div class="sb-pagination" id="paginationContainer">
        <!-- 页码按钮将由 JS 自动渲染生成 -->
    </div>

</main>

<!-- Footer -->
<footer class="sb-footer">
    <p>© 2026 Starryboard. Built for Discord Communities. Independent & Unaffiliated.</p>
</footer>

<script src="search.js"></script>
</body>
</html>
