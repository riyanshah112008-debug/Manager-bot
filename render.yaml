services:
  - type: web
    name: starry-bot
    env: docker
    # Paid always-on compute: 1 CPU / 2 GB RAM for Discord Gateway + local Lavalink audio sidecar.
    plan: 1c-2g
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: VERIFY_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CUSTOM_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: manager-bot-96c07
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: LAVALINK_URL
        value: 127.0.0.1:2333
      - key: LAVALINK_SECURE
        value: "false"
      - key: LAVALINK_NODE_NAME
        value: Render-Local-Lavalink
      - key: STARRY_REQUIRE_LAVALINK
        value: "true"
      - key: STARRY_DISABLE_STREAM_RESOLVER
        value: "1"
      - key: STARRY_ENABLE_PUBLIC_LAVALINK_NODES
        value: "false"
