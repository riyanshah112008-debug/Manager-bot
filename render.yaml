services:
  - type: web
    name: starry-bot
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: VERIFY_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CUSTOM_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: manager-bot-96c07
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
