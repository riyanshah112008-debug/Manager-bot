<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starry Dashboard • Next-Gen Discord Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0A0B10;
            --surface: #11131C;
            --card: rgba(22, 25, 38, 0.85);
            --card-hover: rgba(30, 34, 52, 0.95);
            --primary: #5865F2;
            --primary-glow: rgba(88, 101, 242, 0.4);
            --accent: #9B59B6;
            --cyan: #00F2FE;
            --success: #10B981;
            --gold: #F59E0B;
            --danger: #EF4444;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(88, 101, 242, 0.4);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(88, 101, 242, 0.15), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(155, 89, 182, 0.12), transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #fff;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #5865F2, #9B59B6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface);
            padding: 6px 14px 6px 6px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-primary { background: linear-gradient(135deg, #5865F2, #9B59B6); color: #fff; box-shadow: 0 4px 15px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-glow); }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #fff; border-color: var(--border); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-vote { background: linear-gradient(135deg, #FF79C6, #BD93F9); color: #fff; }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
        }

        .section-header {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-desc { color: var(--text-muted); font-size: 0.95rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .guild-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .guild-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .guild-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 14px;
            border: 2px solid var(--border);
            object-fit: cover;
        }

        .guild-name { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
        .guild-members { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 18px; }

        /* Settings View Panel */
        .settings-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 40px;
            display: none;
            backdrop-filter: blur(20px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #E2E8F0;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(10, 11, 16, 0.7);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #10B981;
            color: #fff;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            display: none;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <div class="brand-logo">⭐</div>
            <div class="brand-text">
                <h1 style="font-size: 1.2rem;">Starry<span style="color:var(--cyan)">.gg</span></h1>
            </div>
        </a>
        <div class="user-nav">
            <a href="/vote" target="_blank" class="btn btn-vote">🗳️ Vote on Top.gg</a>
            <div id="userContainer" class="user-pill" style="display:none;">
                <img id="userAvatar" src="" class="user-avatar" alt="Avatar">
                <span id="userName" style="font-weight:700; font-size:0.9rem;">Admin</span>
            </div>
            <a href="/auth/login" id="loginBtn" class="btn btn-primary">Login with Discord</a>
        </div>
    </header>

    <div class="container">
        <div class="section-header">
            <h2 class="section-title">⚡ Select a Server to Manage</h2>
            <p class="section-desc">Manage custom prefix, anti-nuke God mode, 24/7 music audio, and automated verification.</p>
        </div>

        <div id="guildsGrid" class="grid">
            <div style="grid-column: 1 / -1; text-align:center; padding: 40px; color: var(--text-muted);">
                🔄 Loading servers...
            </div>
        </div>

        <!-- Live Server Settings Panel -->
        <div id="settingsPanel" class="settings-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px;">
                <h3 id="panelGuildTitle" style="font-size: 1.4rem; font-weight:800;">⚙️ Server Configuration</h3>
                <button class="btn btn-secondary" onclick="closeSettings()">✕ Close</button>
            </div>

            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                <div class="form-group">
                    <label class="form-label">⌨️ Server Prefix (Default: ,)</label>
                    <input type="text" id="prefixInput" class="form-input" placeholder="e.g. , or ! or ?" maxlength="5">
                    <small style="color:var(--text-muted); display:block; margin-top:4px;">Single character or custom prefix</small>
                </div>

                <div class="form-group">
                    <label class="form-label">🗣️ Custom AI Trigger Word</label>
                    <input type="text" id="triggerInput" class="form-input" placeholder="e.g. Starry">
                </div>
            </div>

            <div style="margin-top: 20px; display:flex; gap: 12px;">
                <button class="btn btn-primary" onclick="saveSettings()">💾 Save Server Settings</button>
                <button class="btn btn-secondary" onclick="openEmbedSender()">📢 Send Custom Embed</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">✅ Settings saved successfully!</div>

    <script>
        let currentGuildId = null;

        async function initDashboard() {
            try {
                const userRes = await fetch('/auth/user');
                const userData = await userRes.json();

                if (userData.authenticated) {
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('userContainer').style.display = 'flex';
                    document.getElementById('userName').innerText = userData.user.username;
                    document.getElementById('userAvatar').src = userData.user.avatar;
                }

                const guildsRes = await fetch('/api/guilds');
                const data = await guildsRes.json();

                const grid = document.getElementById('guildsGrid');
                if (!data.guilds || data.guilds.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding: 40px; color: var(--text-muted);">No active servers found. Add Starry to your server first!</div>';
                    return;
                }

                grid.innerHTML = data.guilds.map(g => `
                    <div class="guild-card">
                        <img src="${g.icon}" class="guild-icon" alt="${g.name}">
                        <div class="guild-name">${g.name}</div>
                        <div class="guild-members">👥 ${g.memberCount.toLocaleString()} Members</div>
                        <button class="btn btn-primary" style="width:100%;" onclick="openGuildSettings('${g.id}', '${g.name.replace(/'/g, "\\'")}')">⚙️ Manage Server</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Failed to load guilds:', e);
            }
        }

        async function openGuildSettings(guildId, guildName) {
            currentGuildId = guildId;
            document.getElementById('panelGuildTitle').innerText = `⚙️ Manage: ${guildName}`;
            
            try {
                const res = await fetch(`/api/guild/${guildId}`);
                const data = await res.json();
                if (data.success && data.settings) {
                    document.getElementById('prefixInput').value = data.settings.prefix || ',';
                    document.getElementById('triggerInput').value = data.settings.triggerWord || 'Starry';
                }
            } catch (err) {}

            document.getElementById('settingsPanel').style.display = 'block';
            document.getElementById('settingsPanel').scrollIntoView({ behavior: 'smooth' });
        }

        function closeSettings() {
            document.getElementById('settingsPanel').style.display = 'none';
        }

        async function saveSettings() {
            if (!currentGuildId) return;
            const prefix = document.getElementById('prefixInput').value.trim() || ',';
            const triggerWord = document.getElementById('triggerInput').value.trim() || 'Starry';

            try {
                const res = await fetch(`/api/guild/${currentGuildId}/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prefix, triggerWord })
                });
                const data = await res.json();
                if (data.success) {
                    showToast('✅ Server settings updated in real-time!');
                }
            } catch (e) {
                alert('Error saving settings: ' + e.message);
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        initDashboard();
    </script>
</body>
</html>
